name: CI

env:
  DEBUG: napi:*
  APP_NAME: dig-key-value-store
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: write
  id-token: write

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**

jobs:
  validate-pr:
    name: Validate PR source and version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure PR source is develop
        if: ${{ github.event.pull_request.base.ref == 'main' }}
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "develop" ]; then
            echo "Only branch 'develop' can be merged into 'main'. PR head is '${{ github.event.pull_request.head.ref }}'." >&2
            exit 1
          fi
      - name: Fetch main branch for comparison
        run: |
          git fetch origin main:refs/remotes/origin/main
      - name: Read versions (package.json and Cargo.toml)
        id: versions
        run: |
          PR_PKG_VER=$(node -p "require('./package.json').version")
          MAIN_PKG_VER=$(git show origin/main:package.json | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(0,'utf8'));console.log(d.version)")
          echo "pr_pkg_ver=$PR_PKG_VER" >> $GITHUB_OUTPUT
          echo "main_pkg_ver=$MAIN_PKG_VER" >> $GITHUB_OUTPUT
          PR_CRATE_VER=$(grep -m1 '^version\s*=\s*"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          MAIN_CRATE_VER=$(git show origin/main:Cargo.toml | grep -m1 '^version\s*=\s*"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "pr_crate_ver=$PR_CRATE_VER" >> $GITHUB_OUTPUT
          echo "main_crate_ver=$MAIN_CRATE_VER" >> $GITHUB_OUTPUT
          echo "PR package.json version: $PR_PKG_VER"
          echo "Main package.json version: $MAIN_PKG_VER"
          echo "PR Cargo.toml version: $PR_CRATE_VER"
          echo "Main Cargo.toml version: $MAIN_CRATE_VER"
      - name: Ensure npm and Cargo versions match on PR
        run: |
          if [ "${{ steps.versions.outputs.pr_pkg_ver }}" != "${{ steps.versions.outputs.pr_crate_ver }}" ]; then
            echo "package.json version (${{ steps.versions.outputs.pr_pkg_ver }}) must match Cargo.toml version (${{ steps.versions.outputs.pr_crate_ver }}) on PR (develop)." >&2
            exit 1
          fi
      - name: Ensure versions increased
        run: |
          cmp_versions () { [ "$1" = "$2" ] && return 1; printf '%s\n%s\n' "$2" "$1" | sort -V | head -n1 | grep -q "^$2$"; }
          # package.json
          if ! cmp_versions "${{ steps.versions.outputs.pr_pkg_ver }}" "${{ steps.versions.outputs.main_pkg_ver }}"; then
            echo "package.json version must be greater on develop than main." >&2
            exit 1
          fi
          # Cargo.toml
          if ! cmp_versions "${{ steps.versions.outputs.pr_crate_ver }}" "${{ steps.versions.outputs.main_crate_ver }}"; then
            echo "Cargo.toml version must be greater on develop than main." >&2
            exit 1
          fi

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    needs: validate-pr
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Test
        run: cargo test
      - name: Clippy
        run: rustup component add clippy && cargo clippy --all-targets --all-features -- -D warnings
      - name: Unused dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete
      - name: Fmt
        run: rustup component add rustfmt && cargo fmt --all -- --check

  build:
    name: Build binaries - ${{ matrix.settings.target }} - node@22
    needs: rust-checks
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:node-22
            build: |
              set -e &&
              cd /build && rustup update stable && rustup default stable && \
              cargo update -p base64ct --precise 1.6.0 || true &&
              cd /build && npm ci && npm run build -- --target x86_64-unknown-linux-gnu &&
              strip /build/napi-build/*.node || true
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:node-22-aarch64
            build: |
              set -e &&
              cd /build && rustup update stable && rustup default stable && \
              cargo update -p base64ct --precise 1.6.0 || true &&
              cd /build && npm ci && npm run build -- --target aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: npm ci
      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: ${{ matrix.settings.build }}
      - name: Pin base64ct for stable toolchain
        if: ${{ !matrix.settings.docker }}
        run: cargo update -p base64ct --precise 1.6.0 || true
        shell: bash
      - name: Build
        if: ${{ !matrix.settings.docker }}
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: List build outputs
        run: |
          echo "Contents of napi-build:" && ls -lah napi-build || true
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi-build/index.*.node
          if-no-files-found: error

  test-bindings:
    name: Test bindings ${{ matrix.settings.target }} - node@22
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List files
        run: |
          echo Root:
          ls -la
          echo NAPI build dir:
          ls -la napi-build || true
        shell: bash
      - name: Run tests
        run: npm test
