[package]
name = "dig-key-value-store"
version = "0.1.0"
edition = "2021"
description = "A dual-layer caching library with SQLite backend and in-memory LRU cache"
license = "MIT"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros"] }
lru = "0.10.0"
thiserror = "1.0.40"
anyhow = "1.0.70"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.28.0", features = ["full"] }
chrono = "0.4.24"
log = "0.4.17"
env_logger = "0.10.0"
futures = "0.3"
async-trait = "0.1"
base64ct = "=1.6.0"

[dev-dependencies]
tempfile = "3.5.0"
rand = "0.8.5"

[lib]
crate-type = ["cdylib", "rlib"]
