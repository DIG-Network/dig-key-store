[package]
name = "dig-key-store"
version = "0.1.0"
edition = "2021"
description = "A dual-layer caching library with SQLite backend and in-memory LRU cache"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros"] }
lru = "0.10.0"
thiserror = "1.0.40"
tokio = { version = "1.28.0", features = ["full"] }
# NAPI dependencies
napi = { version = "2.12.2", default-features = false, features = ["napi6", "async"] }
napi-derive = "2.12.2"

[build-dependencies]
napi-build = "2.0.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = "symbols"
