[package]
name = "dig-key-store"
version = "1.0.0"
edition = "2024"
description = "A dual-layer caching library with SQLite backend and in-memory LRU cache"

[features]
default = []
napi-bindings = ["napi", "napi-derive", "napi-build"]

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros"] }
lru = "0.16.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
# NAPI dependencies
napi = { version = "3.7.0", default-features = false, features = ["napi10", "async"], optional = true }
napi-derive = { version = "3.4.0", optional = true }

[build-dependencies]
napi-build = { version = "2.3.1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = "symbols"

[profile.test]
opt-level = 0
debug = true
overflow-checks = true
incremental = false
