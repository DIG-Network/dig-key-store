[package]
name = "dig-key-value-store"
version = "0.1.0"
edition = "2021"
description = "A dual-layer caching library with SQLite backend and in-memory LRU cache"
license = "MIT"

[dependencies]
diesel = { version = "2.1.0", features = ["sqlite", "r2d2"] }
diesel_migrations = "2.1.0"
lru = "0.10.0"
r2d2 = "0.8.10"
thiserror = "1.0.40"
anyhow = "1.0.70"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.28.0", features = ["full"] }
chrono = "0.4.24"
log = "0.4.17"
env_logger = "0.10.0"

[dev-dependencies]
tempfile = "3.5.0"
rand = "0.8.5"

[lib]
crate-type = ["cdylib", "rlib"]
